<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./culturama-favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

  <title>Pesquisa Culturama</title>
</head>
<body>
  <main>
    <header>
      <img src="./img/logo-culturama.png" alt="logo da Culturama">
      <h1>Pesquisa de opinião</h1>
    </header>
    <section>
      <form action="./success.html" method="GET">
        <fieldset>
        <!-- DADOS PESSOAIS -->

          <legend>Dados Pessoais</legend>
          <label for="name">Nome</label>
          <input type="text" name="userName" id="name" required>
          <br>
          <label for="age">Idade</label>
          <input type="number" name="userAge" id="age" min="12" max="100" required>
          <br>
          <label for="birthDate">Data de nascimento</label>
          <input type="date" name="UserBirthDate" id="birthDate">
          <br>
          <label for="email">Email</label>
          <input type="email" name="userEmail" id="email" required>
          <br>
          <label for="phoneNumber">Telefone</label>
          <input type="tel" name="userPhoneNumber" id="phoneNumber" pattern="[0-9]{11} " placeholder="DDD + número sem espaços ou hífen" aria-describedby="phoneHelp">
          <small id="phoneHelp">Preencha com 11 dígitos no formato: DDD + número sem espaços ou hífen.</small>
          <br>
          <label for="image">Upload de foto</label>
          <input type="file" name="userImage" id="image" accept="image/*">
        </fieldset> 
        
        <fieldset>
          <!-- PERFIL  -->

          <legend>Perfil</legend>

          <p>Gênero:</p>
          <input type="radio" name="userGender" id="genderFemale" value="feminino">
          <label for="genderFemale">Feminino</label>

          <input type="radio" name="userGender" id="genderMale" value="masculino">
          <label for="genderMale">Masculino</label>

          <input type="radio" name="userGender" id="genderNotInformed" value="notInformed">
          <label for="genderNotInformed">Prefiro não informar</label>
          <br>

          <label for="maritalStatus">Estado Civil:</label>
          <select name="UserMaritalStatus" id="maritalStatus">
            <option value="notInformed">Selecione...</option>
            <option value="casado">Casado</option>
            <option value="solteiro">Solteiro</option>
            <option value="viuvo">Viúvo</option>
            <option value="divorciado">Divorciado</option>
          </select>
        
          
          <label for="state">Estado:</label>
          <select name="userState" id="state" required>
            <option value="acre">Acre</option>
            <option value="alagoas">Alagoas</option>
            <option value="amapa">Amapá</option>
            <option value="amazonas">Amazonas</option>
            <option value="bahia">Bahia</option>
            <option value="ceara">Ceará</option>
            <option value="distritoFederal">Distrito Federal</option>
            <option value="espiritoSanto">Espírito Santo</option>
            <option value="goias">Goiás</option>
            <option value="maranhao">Maranhão</option>
            <option value="matoGrosso">Mato Grosso</option>
            <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
            <option value="minasGerais">Minas Gerais</option>
            <option value="para">Pará</option>
            <option value="paraiba">Paraíba</option>
            <option value="parana">Paraná</option>
            <option value="pernambuco">Pernambuco</option>
            <option value="piaui">Piauí</option>
            <option value="rioDeJaneiro">Rio de Janeiro</option>
            <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
            <option value="rioGrandeDoSul">Rio Grande do Sul</option>
            <option value="rondonia">Rondônia</option>
            <option value="roraima">Roraima</option>
            <option value="santaCatarina">Santa Catarina</option>
            <option value="saoPaulo">São Paulo</option>
            <option value="sergipe">Sergipe</option>
            <option value="tocantins">Tocantins</option>
          </select>

          <label for="city">Cidade</label>
          <input type="text" name="userCity" id="city">
        </fieldset>

        <fieldset>
          <!-- HÁBITOS -->

          <legend>Hábitos</legend>

          <p>Redes sociais:</p>
          <input type="checkbox" name="socialMedia" id="socialInstagram" value="instagram">
          <label for="socialInstagram">Instagram</label>
          <br>
          <input type="checkbox" name="socialMedia" id="socialX" value="x">
          <label for="socialX">X</label>
          <br>
          <input type="checkbox" name="socialMedia" id="socialFacebook" value="facebook">
          <label for="socialFacebook">Facebook</label>
          <br>
          <input type="checkbox" name="socialMedia" id="socialTiktok" value="tiktok">
          <label for="socialTiktok">Tiktok</label>
          <br>

          <label for="musicStyle">Estilo musical:</label>
          <input type="text" name="userMusicStyle" id="musicStyle" list="styleTypes">
          <datalist id="styleTypes">
            <option value="Pop">
            <option value="Rock">
            <option value="Samba">
            <option value="Sertanejo">
          </datalist>
          <br>
          <label for="favoriteColor">Cor favorita:</label>
          <input type="color" name="userFavoriteColor" id="favoriteColor">
        </fieldset>

        <fieldset>
          <!-- OPINIÃO -->

          <legend>Opinião</legend>
          <p>
            Qual o seu nível de satisfação com a Culturama?
          </p>
          <input type="radio" name="userSatisfaction" id="great">
          <label for="great">Ótima</label>
          <br>
          <input type="radio" name="userSatisfaction" id="good">
          <label for="good">Boa</label>
          <br>
          <input type="radio" name="userSatisfaction" id="regular">
          <label for="regular">Regular</label>
          <br>
          <input type="radio" name="userSatisfaction" id="bad">
          <label for="bad">Ruim</label>
          <br>
          <label for="commentBox">Possui alguma sugestão?</label>
          <textarea name="userComment" id="commentBox" placeholder="Digite aqui sua opnião..."></textarea>
        </fieldset>
        
        <fieldset>
          <!-- CONSENTIMENTO E RESULTADO -->

          <legend>Confirmações</legend>
          <input type="checkbox" name="userLgpd" id="lgpdAccept" value="accepted" required>
          <label for="lgpdAccept">Eu aceito participar da pesquisa</label>
          <br>
          <input type="checkbox" name="userGetResult" id="getResult" value="accepted">
          <label for="getResult">Desejo receber o resultado por e-mail</label>
          
        </fieldset>

        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
      </form>
    </section>
</main>
  
  
</body>
</html>
